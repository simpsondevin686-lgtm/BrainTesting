<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: monospace; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 0; }
        #ui { position: absolute; top: 10px; left: 10px; color: #fff; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 5px; z-index: 100; pointer-events: none; }
        .oxytocin { color: #FF69B4; font-weight: bold; }
        .dopamine { color: #00FFFF; font-weight: bold; }
        .mating { color: #FFFF00; font-weight: bold; font-size: 20px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 200; text-shadow: 2px 2px 4px #000; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">
        <div>Neurons per brain: 15,000 (Modular)</div>
        <div id="status1">Male: Waking up...</div>
        <div id="status2">Female: Waking up...</div>
    </div>
    <div id="mating_text" class="mating" style="display:none;">MATING</div>
    <script>
        // ==========================================
        // 1. EXPANDED MODULAR BRAIN (15,000 Neurons)
        // ==========================================
        class ModularBrain {
            constructor() {
                this.numNeurons = 15000;
                this.regions = {
                    sensory: { start: 0, end: 150 },       // Vision, Touch, Pain, Mate Pheromones
                    drive:   { start: 150, end: 160 },     // Drive
                    assoc_E: { start: 160, end: 11260 },   // Excitatory
                    assoc_I: { start: 11260, end: 14950 }, // Inhibitory
                    motor:   { start: 14950, end: 15000 }  // Motor
                };
                this.V = new Float32Array(this.numNeurons);
                this.learningRate = 0.005; 
                this.decayRate = 0.99; 
                this.buildModularConnections();
            }

            buildModularConnections() {
                const numConnections = 1500000; 
                this.W_data = new Float32Array(numConnections);
                this.W_indices = new Int32Array(numConnections);
                this.W_indptr = new Int32Array(this.numNeurons + 1);

                let edgeIdx = 0;
                const outDegree = 100;

                for (let i = 0; i < this.numNeurons; i++) {
                    this.W_indptr[i] = edgeIdx;
                    let isInhibitory = (i >= this.regions.assoc_I.start && i < this.regions.assoc_I.end);
                    let baseWeight = Math.random() * 0.5;
                    let finalWeight = isInhibitory ? -baseWeight : baseWeight;

                    for (let k = 0; k < outDegree; k++) {
                        let target;
                        if (i < this.regions.drive.end) {
                            target = this.regions.assoc_E.start + Math.floor(Math.random() * (this.regions.assoc_I.end - this.regions.assoc_E.start));
                        } else if (i < this.regions.assoc_I.end) {
                            if (Math.random() < 0.9) target = this.regions.assoc_E.start + Math.floor(Math.random() * (this.regions.assoc_I.end - this.regions.assoc_E.start));
                            else target = this.regions.motor.start + Math.floor(Math.random() * (this.regions.motor.end - this.regions.motor.start));
                        } else {
                            if (Math.random() < 0.8) target = this.regions.motor.start + Math.floor(Math.random() * (this.regions.motor.end - this.regions.motor.start));
                            else target = this.regions.drive.start + Math.floor(Math.random() * (this.regions.drive.end - this.regions.drive.start));
                        }
                        this.W_data[edgeIdx] = finalWeight;
                        this.W_indices[edgeIdx] = target;
                        edgeIdx++;
                    }
                }
                this.W_indptr[this.numNeurons] = edgeIdx;
            }

            step(inputs, total_reward) {
                for (let i = 0; i < this.regions.sensory.end; i++) {
                    this.V[this.regions.sensory.start + i] = inputs[i];
                }

                let urge = Math.max(0.5, 10.0 - inputs[120]);
                this.V[this.regions.drive.start] = urge; 
                this.V[this.regions.drive.start + 1] = 1.0;

                let newV = new Float32Array(this.numNeurons);
                for (let i = 0; i < this.numNeurons; i++) {
                    newV[i] = this.V[i] * 0.90; 
                }

                for (let i = 0; i < this.numNeurons; i++) {
                    let start = this.W_indptr[i];
                    let end = this.W_indptr[i + 1];
                    let sourceVal = this.V[i];
                    if (sourceVal > 0.1) { 
                        for (let j = start; j < end; j++) {
                            newV[this.W_indices[j]] += sourceVal * this.W_data[j];
                        }
                    }
                }

                for (let i = 0; i < this.numNeurons; i++) {
                    this.V[i] = Math.max(0, Math.min(10.0, newV[i]));
                }

                for (let i = 0; i < this.numNeurons; i++) {
                    let isInhibitory = (i >= this.regions.assoc_I.start && i < this.regions.assoc_I.end);
                    let start = this.W_indptr[i];
                    let end = this.W_indptr[i + 1];
                    
                    let sourceVal = this.V[i];
                    if (sourceVal > 1.0 && total_reward > 0.01) {
                        for (let j = start; j < end; j++) {
                            if (this.V[this.W_indices[j]] > 1.0) {
                                let dw = this.learningRate * total_reward;
                                dw = isInhibitory ? -Math.abs(dw) : Math.abs(dw);
                                this.W_data[j] = Math.max(-5.0, Math.min(5.0, this.W_data[j] + dw));
                            }
                        }
                    }
                    for (let j = start; j < end; j++) {
                        this.W_data[j] *= this.decayRate;
                    }
                }

                let out = { moveX: 0, moveZ: 0, climb: 0, look: 0 };
                for(let k=0; k<10; k++) {
                    out.moveX += this.V[this.regions.motor.start + k];
                    out.moveZ += this.V[this.regions.motor.start + 10 + k];
                    out.climb += this.V[this.regions.motor.start + 20 + k];
                    out.look  += this.V[this.regions.motor.start + 30 + k];
                }
                out.moveX /= 10; out.moveZ /= 10; out.climb /= 10; out.look /= 10;
                return out;
            }
        }

        // ==========================================
        // 2. THE 3D WORLD
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 50, 200);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(50, 100, 50);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        const groundGeo = new THREE.PlaneGeometry(500, 500);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x556B2F });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.1;
        scene.add(ground);

        let trees = [];
        function addTree(x, z, height) {
            const trunkGeo = new THREE.CylinderGeometry(1, 1, height, 8);
            const trunkMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.set(x, height / 2, z);
            scene.add(trunk);

            const leavesGeo = new THREE.ConeGeometry(4, 8, 8);
            const leavesMat = new THREE.MeshLambertMaterial({ color: 0x228B22 });
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.set(x, height + 2, z);
            scene.add(leaves);
            trees.push({ x: x, z: z, height: height, radius: 1.5 });
        }

        for (let i = 0; i < 30; i++) {
            addTree((Math.random() - 0.5) * 150, (Math.random() - 0.5) * 150, Math.random() * 10 + 5);
        }

        // ==========================================
        // 3. CREATURES
        // ==========================================
        class Creature {
            constructor(isMale) {
                this.isMale = isMale;
                this.brain = new ModularBrain();
                this.x = (Math.random() - 0.5) * 100;
                this.z = (Math.random() - 0.5) * 100;
                this.y = 0;
                this.angle = 0;
                this.vx = 0;
                this.vz = 0;
                this.vAngle = 0;
                this.climbing = false;
                this.lastDist = 999;
                
                const geo = new THREE.BoxGeometry(isMale ? 2 : 1.8, isMale ? 2 : 1.8, isMale ? 2 : 1.8);
                const mat = new THREE.MeshLambertMaterial({ color: isMale ? 0x00FF00 : 0xFF00FF });
                this.mesh = new THREE.Mesh(geo, mat);
                scene.add(this.mesh);

                this.colorBase = new THREE.Color(isMale ? 0x00FF00 : 0xFF00FF);
                this.colorPink = new THREE.Color(0xFF69B4);
                this.colorCyan = new THREE.Color(0x00FFFF);
                this.targetColor = new THREE.Color().copy(this.colorBase);
            }

            update(mate) {
                // Find nearest tree
                let nearestTree = null;
                let minDist = 999;
                for (let t of trees) {
                    let dist = Math.sqrt((t.x - this.x)**2 + (t.z - this.z)**2);
                    if (dist < minDist) { minDist = dist; nearestTree = t; }
                }

                let inputs = new Float32Array(150); // Expanded inputs
                
                // Vision (Tree)
                if (nearestTree) {
                    let dx = nearestTree.x - this.x;
                    let dz = nearestTree.z - this.z;
                    let absoluteAngle = Math.atan2(dz, dx);
                    let relativeAngle = absoluteAngle - this.angle; 
                    
                    inputs[0] = 1.0 / (minDist + 1); 
                    inputs[1] = Math.sin(relativeAngle); 
                    inputs[2] = Math.cos(relativeAngle); 
                }

                // Vision (Mate)
                let dxMate = mate.x - this.x;
                let dzMate = mate.z - this.z;
                let mateDist = Math.sqrt(dxMate*dxMate + dzMate*dzMate);
                let mateAngle = Math.atan2(dzMate, dxMate) - this.angle;
                
                inputs[10] = 1.0 / (mateDist + 1); // Proximity to mate
                inputs[11] = Math.sin(mateAngle);
                inputs[12] = Math.cos(mateAngle);
                inputs[13] = mate.y; // Mate height

                // Proprioception
                inputs[120] = this.y;
                let touching_tree = minDist < 2.5;
                inputs[130] = touching_tree ? 1.0 : 0.0;

                // Reward Logic
                let dopamine = this.y > 2.0 ? this.y * 0.1 : 0.0;
                let oxytocin = 0.0;

                if (minDist < this.lastDist - 0.1) oxytocin += 1.5;
                if (touching_tree) oxytocin += 3.0;
                this.lastDist = minDist;

                let total_reward = dopamine + oxytocin;

                let motorOut = this.brain.step(inputs, total_reward);

                // Physics
                let targetVx = Math.tanh(motorOut.moveX - 0.8); 
                let targetVz = Math.tanh(motorOut.moveZ - 0.8);
                let targetVAngle = Math.tanh(motorOut.look - 1.0) * 0.015; 
                let climbCmd = Math.max(0, Math.min(1, motorOut.climb * 0.5));

                this.vx = this.vx * 0.9 + targetVx * 0.1;
                this.vz = this.vz * 0.9 + targetVz * 0.1;
                this.vAngle = this.vAngle * 0.9 + targetVAngle * 0.1;

                this.angle += this.vAngle;
                
                let nextX = this.x + (this.vx * Math.cos(this.angle) - this.vz * Math.sin(this.angle));
                let nextZ = this.z + (this.vx * Math.sin(this.angle) + this.vz * Math.cos(this.angle));

                let collided = false;
                let hitTree = null;
                for (let t of trees) {
                    let distToTree = Math.sqrt((t.x - nextX)**2 + (t.z - nextZ)**2);
                    if (distToTree < t.radius + 1.0) {
                        collided = true;
                        hitTree = t;
                        break;
                    }
                }

                if (!collided) {
                    this.x = nextX;
                    this.z = nextZ;
                    this.climbing = false;
                } else {
                    this.angle = Math.atan2(hitTree.z - this.z, hitTree.x - this.x);
                    this.vAngle = 0; this.vx = 0; this.vz = 0;
                    this.climbing = true;
                    this.y += climbCmd * 0.5;
                    if (this.y > hitTree.height) this.y = hitTree.height;
                }

                if (!this.climbing && this.y > 0) {
                    this.y -= 0.2; 
                    if (this.y < 0) this.y = 0;
                }

                // Color logic
                if (oxytocin > 0) this.targetColor.copy(this.colorPink);
                else if (dopamine > 0) this.targetColor.copy(this.colorCyan);
                else this.targetColor.copy(this.colorBase);
                
                this.mesh.material.color.lerp(this.targetColor, 0.1);
                this.mesh.position.set(this.x, this.y + 1, this.z);
                this.mesh.rotation.y = this.angle;
            }
        }

        // ==========================================
        // 4. WORLD STATE & MATING
        // ==========================================
        let male = new Creature(true);
        let female = new Creature(false);
        let babies = [];
        let matingTimer = 0;

        function triggerMating() {
            document.getElementById('mating_text').style.display = 'block';
            
            // Spawn 2 babies (1 boy, 1 girl)
            for(let i=0; i<2; i++) {
                let isBoy = i === 0;
                let baby = new Creature(isBoy);
                baby.mesh.scale.set(0.5, 0.5, 0.5); // Make them small
                
                // Cling to a random tree
                let randomTree = trees[Math.floor(Math.random() * trees.length)];
                baby.x = randomTree.x + 2;
                baby.z = randomTree.z;
                baby.y = randomTree.height; // Spawn at the top
                baby.climbing = true;
                babies.push(baby);
            }

            // Reset parents to separate trees
            let t1 = trees[Math.floor(Math.random() * trees.length)];
            let t2 = trees[Math.floor(Math.random() * trees.length)];
            male.x = t1.x; male.z = t1.z; male.y = 0;
            female.x = t2.x; female.z = t2.z; female.y = 0;

            setTimeout(() => {
                document.getElementById('mating_text').style.display = 'none';
            }, 3000);
        }

        function simulate() {
            if (matingTimer > 0) {
                matingTimer -= 1;
                if (matingTimer === 0) {
                    triggerMating();
                }
                return; // Pause game logic during mating
            }

            male.update(female);
            female.update(male);

            // Check Mating Condition
            let dx = male.x - female.x;
            let dz = male.z - female.z;
            let dist = Math.sqrt(dx*dx + dz*dz);

            // If both are high up and close to each other
            if (male.y > 5.0 && female.y > 5.0 && dist < 4.0) {
                // Massive reward to reinforce this behavior
                male.brain.step(new Float32Array(150), 10.0); 
                female.brain.step(new Float32Array(150), 10.0);
                
                // Trigger mating sequence
                matingTimer = 120; // 2 seconds at 60fps
                document.getElementById('mating_text').style.display = 'block';
                document.getElementById('mating_text').innerText = "MATING...";
            }

            // Update Babies
            babies.forEach(baby => {
                baby.update(male); // They just follow the same logic
            });

            document.getElementById('status1').innerText = `Male: Y=${male.y.toFixed(1)} | Climb=${male.climbing}`;
            document.getElementById('status2').innerText = `Female: Y=${female.y.toFixed(1)} | Climb=${female.climbing}`;
        }

        function render() {
            // Camera follows male
            const camDistance = 35;
            const camHeight = 20;
            
            camera.position.x = male.mesh.position.x - Math.sin(male.angle) * camDistance;
            camera.position.z = male.mesh.position.z - Math.cos(male.angle) * camDistance;
            camera.position.y = male.mesh.position.y + camHeight;
            
            camera.lookAt(male.mesh.position);
            renderer.render(scene, camera);
        }

        function loop() {
            simulate();
            render();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
