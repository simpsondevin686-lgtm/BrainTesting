<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: monospace; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 0; }
        #ui { position: absolute; top: 10px; left: 10px; color: #fff; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 5px; z-index: 100; pointer-events: none; font-size: 12px; }
        #api-box { position: absolute; top: 10px; right: 10px; z-index: 200; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 5px; }
        input { padding: 5px; font-family: monospace; }
        .infected { color: #FF0000; font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="brain.js"></script>
</head>
<body>
    <div id="ui">
        <div>Parasitic Wasp (30k Neurons)</div>
        <div id="wasp-status">Hunting...</div>
        <div id="bee-status">Bee: Normal</div>
        <div id="ai-thought">AI: Waiting...</div>
    </div>
    <div id="api-box">
        <input type="password" id="apiKey" placeholder="Enter Groq API Key">
        <button onclick="saveKey()">Save</button>
    </div>
    <script>
        let GROQ_KEY = localStorage.getItem("groq_key") || "";
        function saveKey() {
            GROQ_KEY = document.getElementById("apiKey").value;
            localStorage.setItem("groq_key", GROQ_KEY);
            document.getElementById("api-box").style.display = "none";
        }
        if (GROQ_KEY) document.getElementById("api-box").style.display = "none";

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 50, 200);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(50, 100, 50);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        // Environment
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshLambertMaterial({color: 0x556B2F}));
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        let trees = [];
        for (let i = 0; i < 20; i++) {
            let h = Math.random() * 15 + 5;
            let x = (Math.random() - 0.5) * 200;
            let z = (Math.random() - 0.5) * 200;
            let trunk = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, h, 8), new THREE.MeshLambertMaterial({color: 0x8B4513}));
            trunk.position.set(x, h/2, z);
            scene.add(trunk);
            trees.push({x, z, h});
        }

        // Entities
        const beeMesh = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), new THREE.MeshLambertMaterial({color: 0xFFFF00}));
        scene.add(beeMesh);
        
        const waspMesh = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshLambertMaterial({color: 0xFF0000}));
        scene.add(waspMesh);

        let bee = { x: 0, y: 10, z: 0, pitch: 0, yaw: 0, speed: 0.5 };
        let wasp = { x: 0, y: 1, z: 0, pitch: 0, yaw: 0, speed: 0.2, attached: false };
        
        const parasiteBrain = new ParasiteBrain();
        let aiTimer = 0;
        let aiThought = "Waiting for API...";

        async function askGroq() {
            if (!GROQ_KEY) return;
            let prompt = `You are a bee. Current height: ${bee.y.toFixed(1)}. Return ONLY a JSON object with 'pitch' (-1 to 1), 'yaw' (-1 to 1), and 'thrust' (0 to 1). Explore the world.`;
            try {
                let res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${GROQ_KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: [{role: "user", content: prompt}], temperature: 0.7, max_tokens: 50 })
                });
                let data = await res.json();
                let txt = data.choices[0].message.content;
                if (txt.includes("```json")) txt = txt.replace(/```json/g, "").replace(/```/g, "");
                let cmd = JSON.parse(txt);
                if (!wasp.attached) {
                    bee.pitch = cmd.pitch;
                    bee.yaw = cmd.yaw;
                    bee.speed = cmd.thrust * 0.5;
                }
                aiThought = `P:${cmd.pitch.toFixed(1)} Y:${cmd.yaw.toFixed(1)}`;
            } catch(e) { aiThought = "API Error"; }
        }

        function simulate() {
            // 1. Parasite Brain Logic
            let dx = bee.x - wasp.x;
            let dy = bee.y - wasp.y;
            let dz = bee.z - wasp.z;
            let dist = Math.sqrt(dx*dx + dy*dy + dz*dz);

            // Inputs: [RelX, RelY, RelZ, Dist, Attached]
            parasiteBrain.in[0] = dx; parasiteBrain.in[1] = dy; parasiteBrain.in[2] = dz;
            parasiteBrain.in[3] = dist;
            parasiteBrain.in[4] = wasp.attached ? 1 : 0;

            // Reward Logic
            let reward = 0;
            if (!wasp.attached) {
                reward = 1.0 / (dist + 1); // Reward for getting closer
                if (dist < 2.0) {
                    wasp.attached = true;
                    document.getElementById("bee-status").innerText = "Bee: PARASITIZED";
                    document.getElementById("bee-status").className = "infected";
                }
            } else {
                reward = 1000; // Massive reward for being attached
                if (bee.y < 5) reward += (10 - bee.y) * 100; // Reward for driving into ground
            }

            let mot = parasiteBrain.step(reward);

            // 2. Physics
            if (!wasp.attached) {
                wasp.pitch += mot.pitch * 0.1;
                wasp.yaw += mot.yaw * 0.1;
                wasp.pitch = Math.max(-Math.PI/4, Math.min(Math.PI/4, wasp.pitch));
                
                wasp.x += Math.sin(wasp.yaw) * wasp.speed;
                wasp.z += Math.cos(wasp.yaw) * wasp.speed;
                wasp.y += Math.sin(wasp.pitch) * wasp.speed;
                if (wasp.y < 0) wasp.y = 0;
            } else {
                // Parasite overrides Bee
                bee.pitch = mot.pitch;
                bee.yaw = mot.yaw;
                bee.speed = Math.max(0, mot.thrust);
                
                wasp.x = bee.x;
                wasp.y = bee.y + 1.5; // Sit on back
                wasp.z = bee.z;
            }

            // Bee Physics
            if (!wasp.attached) {
                // AI controls
                aiTimer++;
                if (aiTimer > 120) { // Ask AI every 2 seconds (60fps)
                    askGroq();
                    aiTimer = 0;
                }
            }
            
            bee.x += Math.sin(bee.yaw) * bee.speed;
            bee.z += Math.cos(bee.yaw) * bee.speed;
            bee.y += Math.sin(bee.pitch) * bee.speed;
            if (bee.y < 0) bee.y = 0;

            // 3. Render
            beeMesh.position.set(bee.x, bee.y, bee.z);
            beeMesh.rotation.set(bee.pitch, bee.yaw, 0);
            
            waspMesh.position.set(wasp.x, wasp.y, wasp.z);
            waspMesh.rotation.set(wasp.pitch, wasp.yaw, 0);

            // Camera follow Wasp
            const d = 25;
            camera.position.x = waspMesh.position.x - Math.sin(wasp.yaw) * d;
            camera.position.z = waspMesh.position.z - Math.cos(wasp.yaw) * d;
            camera.position.y = waspMesh.position.y + 10;
            camera.lookAt(waspMesh.position);

            document.getElementById("wasp-status").innerText = `Wasp: Y=${wasp.y.toFixed(1)} Dist=${dist.toFixed(1)}`;
            document.getElementById("ai-thought").innerText = `AI: ${aiThought}`;
            
            renderer.render(scene, camera);
            requestAnimationFrame(simulate);
        }

        simulate();
    </script>
</body>
</html>
