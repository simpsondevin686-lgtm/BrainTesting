<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
body{margin:0;overflow:hidden;background:#87CEEB;font-family:monospace}
canvas{display:block;position:absolute;top:0;left:0;z-index:0}
#ui{position:absolute;top:10px;left:10px;color:#fff;background:rgba(0,0,0,.8);padding:10px;border-radius:5px;z-index:100;pointer-events:none;font-size:12px}
.m{color:#FF0;font-weight:700;font-size:20px;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:200;text-shadow:2px 2px 4px #000}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="ui"><div id="pop">Brains: 2</div><div id="s1">Youngest: 0s</div><div id="s2">Pop Size: 2</div></div>
<div id="mt" class="m" style="display:none">MATING</div>
<script>
class B{
constructor(n){
this.n=n;this.V=new Float32Array(n);this.nV=new Float32Array(n);this.in=new Float32Array(150);this.lr=.005;this.decayT=0;this.build();
this.E_end=Math.floor(n*.75);this.I_end=Math.floor(n*.99);}
build(){
const c=this.n*100;this.wd=new Float32Array(c);this.wi=new Int32Array(c);this.wp=new Int32Array(this.n+1);let e=0;
for(let i=0;i<this.n;i++){
this.wp[i]=e;let isI=(i>=Math.floor(this.n*.75)&&i<Math.floor(this.n*.99));let base=Math.random()*.5;let fw=isI?-base:base;
for(let k=0;k<100;k++){
let t;
if(i<160)t=160+Math.floor(Math.random()*(this.n-160));
else if(i<Math.floor(this.n*.99)){
t=Math.random()<.9?160+Math.floor(Math.random()*(this.n-160)):Math.floor(this.n*.99)+Math.floor(Math.random()*50);
}else{
t=Math.random()<.8?Math.floor(this.n*.99)+Math.floor(Math.random()*50):150+Math.floor(Math.random()*10);}
this.wd[e]=fw;this.wi[e]=t;e++;}}
this.wp[this.n]=e;}
step(rew){
this.V[150]=Math.max(.5,10-this.in[120]);this.V[151]=1;
for(let i=0;i<this.n;i++)this.nV[i]=this.V[i]*.9;
for(let i=0;i<this.n;i++){
let s=this.wp[i],e=this.wp[i+1],sv=this.V[i];
if(sv>.1)for(let j=s;j<e;j++)this.nV[this.wi[j]]+=sv*this.wd[j];}
for(let i=0;i<this.n;i++)this.V[i]=Math.max(0,Math.min(10,this.nV[i]));
this.decayT++;if(this.decayT>=10){for(let j=0;j<this.wd.length;j++)this.wd[j]*=.9;this.decayT=0;}
if(rew>.01){
for(let i=0;i<this.n;i++){
let sv=this.V[i];
if(sv>1){
let isI=(i>=Math.floor(this.n*.75)&&i<Math.floor(this.n*.99));let s=this.wp[i],e=this.wp[i+1];
for(let j=s;j<e;j++){if(this.V[this.wi[j]]>1){
let dw=this.lr*rew;dw=isI?-Math.abs(dw):Math.abs(dw);this.wd[j]=Math.max(-5,Math.min(5,this.wd[j]+dw));}}}}
}
let o={x:0,z:0,c:0,l:0};let st=this.n-50;
for(let k=0;k<10;k++){o.x+=this.V[st+k];o.z+=this.V[st+10+k];o.c+=this.V[st+20+k];o.l+=this.V[st+30+k];}
o.x/=10;o.z/=10;o.c/=10;o.l/=10;return o;}}

const scene=new THREE.Scene();scene.background=new THREE.Color(0x87CEEB);scene.fog=new THREE.Fog(0x87CEEB,50,200);
const cam=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight);document.body.appendChild(ren.domElement);
const light=new THREE.DirectionalLight(0xffffff,1.2);light.position.set(50,100,50);scene.add(light);scene.add(new THREE.AmbientLight(0xffffff,.5));
const gGeo=new THREE.PlaneGeometry(500,500),gMat=new THREE.MeshLambertMaterial({color:0x556B2F}),g=new THREE.Mesh(gGeo,gMat);g.rotation.x=-Math.PI/2;g.position.y=-.1;scene.add(g);

let trees=[];
function addT(x,z,h){
const tG=new THREE.CylinderGeometry(1,1,h,8),tM=new THREE.MeshLambertMaterial({color:0x8B4513}),t=new THREE.Mesh(tG,tM);t.position.set(x,h/2,z);scene.add(t);
const lG=new THREE.ConeGeometry(4,8,8),lM=new THREE.MeshLambertMaterial({color:0x228B22}),l=new THREE.Mesh(lG,lM);l.position.set(x,h+2,z);scene.add(l);
trees.push({x,z,h,r:1.5});}
for(let i=0;i<30;i++)addT((Math.random()-.5)*150,(Math.random()-.5)*150,Math.random()*10+5);

class C{
constructor(isM,gen){
this.isM=isM;this.gen=gen;this.age=0;this.isMature=false;this.cool=0;
let bSize=gen===0?15000:(gen===1?3000:1000);
this.brain=new B(bSize);
this.x=(Math.random()-.5)*100;this.z=(Math.random()-.5)*100;this.y=0;this.angle=0;this.vx=0;this.vA=0;this.climbing=false;this.lastDist=999;this.lastMateDist=999;
const s=gen===0?(isM?2:1.8):(gen===1?1.2:0.8);
const geo=new THREE.BoxGeometry(s,s,s),mat=new THREE.MeshLambertMaterial({color:isM?0x00FF00:0xFF00FF});
this.mesh=new THREE.Mesh(geo,mat);scene.add(this.mesh);
this.cB=new THREE.Color(isM?0x00FF00:0xFF00FF);this.cP=new THREE.Color(0xFF69B4);this.cC=new THREE.Color(0x00FFFF);this.tC=new THREE.Color().copy(this.cB);}
update(mate){
this.age+=1/60;
if(this.age>600&&!this.isMature){this.isMature=true;this.mesh.material.emissive=new THREE.Color(0x333333);}
let sc=Math.max(0.2,Math.min(1,this.age/600));this.mesh.scale.set(sc,sc,sc);
if(this.cool>0)this.cool-=1/60;
let nT=null,mD=999,mDSq=999999;
for(let t of trees){let dx=t.x-this.x,dz=t.z-this.z,dSq=dx*dx+dz*dz;if(dSq<mDSq){mDSq=dSq;nT=t;mD=Math.sqrt(dSq);}}
this.brain.in.fill(0);let inp=this.brain.in;
if(nT){let dx=nT.x-this.x,dz=nT.z-this.z,a=Math.atan2(dz,dx)-this.angle;inp[0]=1/(mD+1);inp[1]=Math.sin(a);inp[2]=Math.cos(a);}
let dxM=mate.x-this.x,dzM=mate.z-this.z,mDist=Math.sqrt(dxM*dxM+dzM*dzM),aM=Math.atan2(dzM,dxM)-this.angle;
inp[10]=1/(mDist+1);inp[11]=Math.sin(aM);inp[12]=Math.cos(aM);inp[13]=mate.y;
inp[120]=this.y;inp[130]=mD<2.5?1:0;
let dop=this.y>2?this.y*.1:0,oxy=0;
if(mD<this.lastDist-.1)oxy+=1.5;if(mD<2.5)oxy+=3;this.lastDist=mD;
if(this.y>5&&mate.y>5&&mDist<this.lastMateDist-.1)oxy+=2.0;this.lastMateDist=mDist;
if(this.climbing&&mate.climbing&&mDist<5.0)oxy+=5.0;
let mot=this.brain.step(dop+oxy);
let tVx=Math.max(-1,Math.min(1,mot.x-.5));
let tm=this.climbing?.20:.05;
let tVA=Math.max(-1,Math.min(1,mot.l-.5))*tm;
let cCmd=Math.max(0,Math.min(1,mot.c*.5));
this.vx=this.vx*.9+tVx*.1;this.vA=this.vA*.9+tVA*.1;this.angle+=this.vA;
let nX=this.x+(this.vx*Math.cos(this.angle)),nZ=this.z+(this.vx*Math.sin(this.angle));
let col=false,hT=null;
for(let t of trees){let dx=t.x-nX,dz=t.z-nZ;if(dx*dx+dz*dz<(t.r+1)*(t.r+1)){col=true;hT=t;break;}}
if(!col){this.x=nX;this.z=nZ;this.climbing=false;}
else{
this.climbing=true;let a=Math.atan2(hT.z-this.z,hT.x-this.x);
if(this.y>=hT.h-.5){
if(mot.x>.8&&mDist>5.0){this.x+=Math.cos(this.angle)*4;this.z+=Math.sin(this.angle)*4;this.climbing=false;}
else{this.x=hT.x-Math.cos(a)*(hT.r+1);this.z=hT.z-Math.sin(a)*(hT.r+1);this.vA=this.vA*.9;this.vx=0;this.y=hT.h;}
}else{
this.x=hT.x-Math.cos(a)*(hT.r+1);this.z=hT.z-Math.sin(a)*(hT.r+1);
this.vA=0;this.vx=0;this.y+=Math.max(.1,cCmd*.5);if(this.y>hT.h)this.y=hT.h;}}
if(!this.climbing&&this.y>0){this.y-=.2;if(this.y<0)this.y=0;}
if(oxy>0)this.tC.copy(this.cP);else if(dop>0)this.tC.copy(this.cC);else this.tC.copy(this.cB);
this.mesh.material.color.lerp(this.tC,.1);this.mesh.position.set(this.x,this.y+1,this.z);this.mesh.rotation.y=this.angle;}}

let pop=[new C(true,0),new C(false,0)];
let mT=0;
function mate(a,b){
document.getElementById('mt').style.display='block';document.getElementById('mt').innerText='MATING...';
a.cool=120;b.cool=120;
for(let i=0;i<2;i++){
let baby=new C(i===0,1);let rt=trees[Math.floor(Math.random()*trees.length)];
baby.x=rt.x+2;baby.z=rt.z;baby.y=rt.h;baby.climbing=true;pop.push(baby);}
let t1=trees[Math.floor(Math.random()*trees.length)],t2=trees[Math.floor(Math.random()*trees.length)];
a.x=t1.x;a.z=t1.z;a.y=0;b.x=t2.x;b.z=t2.z;b.y=0;
setTimeout(()=>{document.getElementById('mt').style.display='none';},3000);}

function sim(){
if(mT>0){mT--;return;}
for(let i=0;i<pop.length;i++){
let mateTarget=pop[(i+1)%pop.length];
pop[i].update(mateTarget);
}
for(let i=0;i<pop.length;i++){
for(let j=i+1;j<pop.length;j++){
let a=pop[i],b=pop[j];
if(a.isMature&&b.isMature&&a.isM!==b.isM&&a.cool<=0&&b.cool<=0){
let dx=a.x-b.x,dz=a.z-b.z,dSq=dx*dx+dz*dz;
if(a.y>5&&b.y>5&&dSq<16){mate(a,b);}
}
}
}
document.getElementById('pop').innerText='Pop: '+pop.length+' (Brains: '+(pop.length*3000)+'n)';
document.getElementById('s1').innerText='Youngest: '+Math.max(0,(pop[pop.length-1].age)).toFixed(0)+'s';
document.getElementById('s2').innerText='Adults: '+pop.filter(p=>p.isMature).length;
}

let camYaw=0,isDrag=false,lastX=0;
ren.domElement.addEventListener('touchstart',e=>{isDrag=true;lastX=e.touches[0].clientX;});
ren.domElement.addEventListener('touchmove',e=>{if(isDrag){camYaw-=(e.touches[0].clientX-lastX)*.01;lastX=e.touches[0].clientX;}});
ren.domElement.addEventListener('touchend',()=>{isDrag=false;});

function render(){
const d=35,h=20;let target=pop[0];
cam.position.x=target.mesh.position.x-Math.sin(camYaw)*d;cam.position.z=target.mesh.position.z-Math.cos(camYaw)*d;cam.position.y=target.mesh.position.y+h;
cam.lookAt(target.mesh.position);ren.render(scene,cam);}
function loop(){sim();render();requestAnimationFrame(loop);}loop();
</script>
</body>
</html>
