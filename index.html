<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
body{margin:0;overflow:hidden;background:#87CEEB;font-family:monospace}
canvas{display:block;position:absolute;top:0;left:0;z-index:0}
#ui{position:absolute;top:10px;left:10px;color:#fff;background:rgba(0,0,0,.8);padding:10px;border-radius:5px;z-index:100;pointer-events:none;font-size:12px}
.inf{color:#FF0000;font-weight:bold}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="ui">
    <div>Parasitic Wasp (30k Neurons)</div>
    <div id="ws">Wasp: Y=0</div>
    <div id="bs">Bee: Normal</div>
</div>
<script>
class B{
constructor(n){
this.n=n;this.V=new Float32Array(n);this.nV=new Float32Array(n);this.in=new Float32Array(10);this.lr=.005;this.dt=0;
this.wd=new Float32Array(n*100);this.wi=new Int32Array(n*100);this.wp=new Int32Array(n+1);
let e=0;
for(let i=0;i<n;i++){
this.wp[i]=e;let isI=(i>=n*.8);let b=Math.random()*.5;
for(let k=0;k<100;k++){
this.wd[e]=isI?-b:b;
this.wi[e]=Math.floor(Math.random()*n);
e++;
}
}
this.wp[n]=e;
}
step(r){
for(let i=0;i<this.n;i++)this.nV[i]=this.V[i]*.9;
for(let i=0;i<this.n;i++){
let s=this.wp[i],e=this.wp[i+1],sv=this.V[i];
if(sv>.1)for(let j=s;j<e;j++)this.nV[this.wi[j]]+=sv*this.wd[j];
}
for(let i=0;i<this.n;i++)this.V[i]=Math.max(0,Math.min(10,this.nV[i]));
this.dt++;
if(this.dt>=10){
for(let j=0;j<this.wd.length;j++)this.wd[j]*=.9;
this.dt=0;
}
if(r>.01){
for(let i=0;i<this.n;i++){
let sv=this.V[i];
if(sv>1){
let isI=(i>=this.n*.8);let s=this.wp[i],e=this.wp[i+1];
for(let j=s;j<e;j++){
if(this.V[this.wi[j]]>1){
let dw=this.lr*r;dw=isI?-Math.abs(dw):Math.abs(dw);
this.wd[j]=Math.max(-5,Math.min(5,this.wd[j]+dw));
}
}
}
}
}
return [this.V[this.n-3],this.V[this.n-2],this.V[this.n-1]];
}
}

const sc=new THREE.Scene();sc.background=new THREE.Color(0x87CEEB);sc.fog=new THREE.Fog(0x87CEEB,50,200);
const ca=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);
const re=new THREE.WebGLRenderer({antialias:true});re.setSize(innerWidth,innerHeight);document.body.appendChild(re.domElement);
const li=new THREE.DirectionalLight(0xffffff,1.2);li.position.set(50,100,50);sc.add(li);sc.add(new THREE.AmbientLight(0xffffff,.5));
const gr=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshLambertMaterial({color:0x556B2F}));gr.rotation.x=-Math.PI/2;sc.add(gr);

let tr=[];
for(let i=0;i<20;i++){
let h=Math.random()*15+5,x=(Math.random()-.5)*200,z=(Math.random()-.5)*200;
let tm=new THREE.Mesh(new THREE.CylinderGeometry(1,1,h,8),new THREE.MeshLambertMaterial({color:0x8B4513}));
tm.position.set(x,h/2,z);sc.add(tm);tr.push({x,z,h});
}

const bM=new THREE.Mesh(new THREE.BoxGeometry(2,2,2),new THREE.MeshLambertMaterial({color:0xFFFF00}));sc.add(bM);
const wM=new THREE.Mesh(new THREE.BoxGeometry(1.5,1.5,1.5),new THREE.MeshLambertMaterial({color:0xFF0000}));sc.add(wM);

let b={x:0,y:10,z:0,p:0,yw:0,s:0.5};
let w={x:0,y:1,z:0,p:0,yw:0,s:0.2,att:false};
const wb=new B(30000);
const bb=new B(2000);

function sim(){
let nT=null,mD=999;
for(let t of tr){let d=Math.hypot(t.x-b.x,t.z-b.z);if(d<mD){mD=d;nT=t;}}
bb.in[0]=(nT.x-b.x)/100;bb.in[1]=(nT.z-b.z)/100;bb.in[2]=b.y/10;
let bm=bb.step(1/(mD+1) + (b.y>5&&b.y<20?1:0));
if(!w.att){
b.p+=bm[0]*.1;b.yw+=bm[1]*.1;
b.p=Math.max(-.5,Math.min(.5,b.p));
b.x+=Math.sin(b.yw)*b.s;b.z+=Math.cos(b.yw)*b.s;b.y+=Math.sin(b.p)*b.s;
if(b.y<0)b.y=0;if(b.y>30)b.y=30;
}

let dx=b.x-w.x,dy=b.y-w.y,dz=b.z-w.z,dst=Math.sqrt(dx*dx+dy*dy+dz*dz);
wb.in[0]=dx/50;wb.in[1]=dy/50;wb.in[2]=dz/50;wb.in[3]=dst/50;wb.in[4]=w.att?1:0;
let r=0;
if(!w.att){
r=1/(dst+1);
if(dst<2.5){
w.att=true;
document.getElementById("bs").innerText="Bee: PARASITIZED";
document.getElementById("bs").className="inf";
}
}else{
r=1000;
if(b.y<5)r+=(10-b.y)*100;
}
let wm=wb.step(r);

if(!w.att){
w.p+=wm[0]*.1;w.yw+=wm[1]*.1;
w.p=Math.max(-Math.PI/4,Math.min(Math.PI/4,w.p));
w.x+=Math.sin(w.yw)*w.s;w.z+=Math.cos(w.yw)*w.s;w.y+=Math.sin(w.p)*w.s;
if(w.y<0)w.y=0;
}else{
b.p=wm[0];b.yw=wm[1];b.s=Math.max(0,wm[2]);
w.x=b.x;w.y=b.y+1.5;w.z=b.z;
}

if(!w.att){
b.x+=Math.sin(b.yw)*b.s;b.z+=Math.cos(b.yw)*b.s;b.y+=Math.sin(b.p)*b.s;
if(b.y<0)b.y=0;if(b.y>30)b.y=30;
}

bM.position.set(b.x,b.y,b.z);bM.rotation.set(b.p,b.yw,0);
wM.position.set(w.x,w.y,w.z);wM.rotation.set(w.p,w.yw,0);

let tx=(w.x+b.x)/2, ty=(w.y+b.y)/2, tz=(w.z+b.z)/2;
ca.position.x=tx-Math.sin(w.yw)*30;ca.position.z=tz-Math.cos(w.yw)*30;ca.position.y=ty+15;
ca.lookAt(new THREE.Vector3(tx,ty,tz));

document.getElementById("ws").innerText="Wasp: Y="+w.y.toFixed(1)+" Dist="+dst.toFixed(1);
re.render(sc,ca);requestAnimationFrame(sim);
}
sim();
</script>
</body>
</html>
