<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: monospace; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 0; }
        #ui { position: absolute; top: 10px; left: 10px; color: #fff; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 5px; z-index: 100; pointer-events: none; }
        .oxytocin { color: #FF69B4; font-weight: bold; }
        .dopamine { color: #00FFFF; font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">
        <div>Neurons: 10,500 (Modular CPG)</div>
        <div id="drive_text">Drive: 0.0</div>
        <div id="oxytocin_text" class="oxytocin">Oxytocin: 0.0</div>
        <div id="dopamine_text" class="dopamine">Dopamine: 0.0</div>
        <div id="status">Status: Waking up...</div>
    </div>
    <script>
        class ModularBrain {
            constructor() {
                this.numNeurons = 10500;
                this.regions = {
                    sensory: { start: 0, end: 140 },
                    drive:   { start: 140, end: 150 },
                    assoc_E: { start: 150, end: 7875 },
                    assoc_I: { start: 7875, end: 10450 },
                    motor:   { start: 10450, end: 10500 }
                };
                this.V = new Float32Array(this.numNeurons);
                this.learningRate = 0.001;
                this.decayRate = 0.999;
                this.buildModularConnections();
            }

            buildModularConnections() {
                const numConnections = 1050000; 
                this.W_data = new Float32Array(numConnections);
                this.W_indices = new Int32Array(numConnections);
                this.W_indptr = new Int32Array(this.numNeurons + 1);

                let edgeIdx = 0;
                const outDegree = 100;

                for (let i = 0; i < this.numNeurons; i++) {
                    this.W_indptr[i] = edgeIdx;
                    let isInhibitory = (i >= this.regions.assoc_I.start && i < this.regions.assoc_I.end);
                    let baseWeight = Math.random() * 0.5;
                    let finalWeight = isInhibitory ? -baseWeight : baseWeight;

                    for (let k = 0; k < outDegree; k++) {
                        let target;
                        if (i < this.regions.drive.end) {
                            target = this.regions.assoc_E.start + Math.floor(Math.random() * (this.regions.assoc_I.end - this.regions.assoc_E.start));
                        } else if (i < this.regions.assoc_I.end) {
                            if (Math.random() < 0.9) target = this.regions.assoc_E.start + Math.floor(Math.random() * (this.regions.assoc_I.end - this.regions.assoc_E.start));
                            else target = this.regions.motor.start + Math.floor(Math.random() * (this.regions.motor.end - this.regions.motor.start));
                        } else {
                            if (Math.random() < 0.8) target = this.regions.motor.start + Math.floor(Math.random() * (this.regions.motor.end - this.regions.motor.start));
                            else target = this.regions.drive.start + Math.floor(Math.random() * (this.regions.drive.end - this.regions.drive.start));
                        }
                        this.W_data[edgeIdx] = finalWeight;
                        this.W_indices[edgeIdx] = target;
                        edgeIdx++;
                    }
                }
                this.W_indptr[this.numNeurons] = edgeIdx;
            }

            step(inputs, total_reward) {
                for (let i = 0; i < this.regions.sensory.end; i++) {
                    this.V[this.regions.sensory.start + i] = inputs[i];
                }

                let urge = Math.max(0.5, 10.0 - inputs[120]);
                this.V[this.regions.drive.start] = urge; 
                this.V[this.regions.drive.start + 1] = 1.0;

                let newV = new Float32Array(this.numNeurons);
                for (let i = 0; i < this.numNeurons; i++) {
                    newV[i] = this.V[i] * 0.90; 
                }

                for (let i = 0; i < this.numNeurons; i++) {
                    let start = this.W_indptr[i];
                    let end = this.W_indptr[i + 1];
                    let sourceVal = this.V[i];
                    if (sourceVal > 0.1) { 
                        for (let j = start; j < end; j++) {
                            newV[this.W_indices[j]] += sourceVal * this.W_data[j];
                        }
                    }
                }

                for (let i = 0; i < this.numNeurons; i++) {
                    this.V[i] = Math.max(0, Math.min(10.0, newV[i]));
                }

                for (let i = 0; i < this.numNeurons; i++) {
                    let isInhibitory = (i >= this.regions.assoc_I.start && i < this.regions.assoc_I.end);
                    let start = this.W_indptr[i];
                    let end = this.W_indptr[i + 1];
                    
                    let sourceVal = this.V[i];
                    if (sourceVal > 1.0 && total_reward > 0.01) {
                        for (let j = start; j < end; j++) {
                            if (this.V[this.W_indices[j]] > 1.0) {
                                let dw = this.learningRate * total_reward;
                                dw = isInhibitory ? -Math.abs(dw) : Math.abs(dw);
                                this.W_data[j] = Math.max(-5.0, Math.min(5.0, this.W_data[j] + dw));
                            }
                        }
                    }
                    for (let j = start; j < end; j++) {
                        this.W_data[j] *= this.decayRate;
                    }
                }

                let out = { moveX: 0, moveZ: 0, climb: 0, look: 0 };
                for(let k=0; k<10; k++) {
                    out.moveX += this.V[this.regions.motor.start + k];
                    out.moveZ += this.V[this.regions.motor.start + 10 + k];
                    out.climb += this.V[this.regions.motor.start + 20 + k];
                    out.look  += this.V[this.regions.motor.start + 30 + k];
                }
                out.moveX /= 10; out.moveZ /= 10; out.climb /= 10; out.look /= 10;
                return out;
            }
        }

        const brain = new ModularBrain();

        // ==========================================
        // 2. THE 3D WORLD
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 50, 200);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(50, 100, 50);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        const groundGeo = new THREE.PlaneGeometry(500, 500);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x556B2F });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.1;
        scene.add(ground);

        const creatureGeo = new THREE.BoxGeometry(2, 2, 2);
        // Use a base material that we can smoothly lerp colors on
        const creatureMat = new THREE.MeshLambertMaterial({ color: 0x00FF00 });
        const creature = new THREE.Mesh(creatureGeo, creatureMat);
        scene.add(creature);

        // Color targets for smooth transitions
        const colorGreen = new THREE.Color(0x00FF00);
        const colorPink = new THREE.Color(0xFF69B4);
        const colorCyan = new THREE.Color(0x00FFFF);
        const targetColor = new THREE.Color(0x00FF00);

        let trees = [];
        function addTree(x, z, height) {
            const trunkGeo = new THREE.CylinderGeometry(1, 1, height, 8);
            const trunkMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.set(x, height / 2, z);
            scene.add(trunk);

            const leavesGeo = new THREE.ConeGeometry(4, 8, 8);
            const leavesMat = new THREE.MeshLambertMaterial({ color: 0x228B22 });
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.set(x, height + 2, z);
            scene.add(leaves);
            trees.push({ x: x, z: z, height: height, radius: 1.5 });
        }

        for (let i = 0; i < 30; i++) {
            addTree((Math.random() - 0.5) * 150, (Math.random() - 0.5) * 150, Math.random() * 10 + 5);
        }

        // ==========================================
        // 3. PHYSICS & REWARD LOOP
        // ==========================================
        let c = { x: 0, y: 0, z: 0, angle: 0, climbing: false, vx: 0, vz: 0, vAngle: 0 };
        let lastDistToTree = 999.0;

        function simulate() {
            let nearestTree = null;
            let minDist = 999;
            for (let t of trees) {
                let dist = Math.sqrt((t.x - c.x)**2 + (t.z - c.z)**2);
                if (dist < minDist) { minDist = dist; nearestTree = t; }
            }

            let inputs = new Float32Array(140);
            
            // FIX: Vision Inputs are now RELATIVE to the creature's angle
            if (nearestTree) {
                let dx = nearestTree.x - c.x;
                let dz = nearestTree.z - c.z;
                let absoluteAngle = Math.atan2(dz, dx);
                let relativeAngle = absoluteAngle - c.angle; 
                
                inputs[0] = 1.0 / (minDist + 1); // Distance
                inputs[1] = Math.sin(relativeAngle); // Left/Right relative
                inputs[2] = Math.cos(relativeAngle); // Front/Back relative
            }
            
            if (c.y < 0) inputs[100] = 1.0;
            inputs[120] = c.y;
            let touching_tree = minDist < 2.5;
            inputs[130] = touching_tree ? 1.0 : 0.0;

            // Reward Logic
            let dopamine = c.y > 2.0 ? c.y * 0.1 : 0.0;
            let oxytocin = 0.0;

            if (minDist < lastDistToTree - 0.1) oxytocin += 1.5;
            if (touching_tree) oxytocin += 3.0;
            lastDistToTree = minDist;

            let total_reward = dopamine + oxytocin;

            let motorOut = brain.step(inputs, total_reward);

            // FIX: Smooth Motor Physics (Momentum)
            // Use tanh to smoothly squash the brain signals between -1 and 1
            let targetVx = Math.tanh(motorOut.moveX - 1.0); 
            let targetVz = Math.tanh(motorOut.moveZ - 1.0);
            let targetVAngle = Math.tanh(motorOut.look - 1.0) * 0.05; 
            let climbCmd = Math.max(0, Math.min(1, motorOut.climb * 0.5));

            // Apply momentum (smoothing) so it doesn't snap and spin
            c.vx = c.vx * 0.85 + targetVx * 0.15;
            c.vz = c.vz * 0.85 + targetVz * 0.15;
            c.vAngle = c.vAngle * 0.85 + targetVAngle * 0.15;

            c.angle += c.vAngle;
            
            let nextX = c.x + (c.vx * Math.cos(c.angle) - c.vz * Math.sin(c.angle));
            let nextZ = c.z + (c.vx * Math.sin(c.angle) + c.vz * Math.cos(c.angle));

            // Collision
            let collided = false;
            for (let t of trees) {
                let distToTree = Math.sqrt((t.x - nextX)**2 + (t.z - nextZ)**2);
                if (distToTree < t.radius + 1.0) {
                    collided = true;
                    c.climbing = true;
                    break;
                }
            }

            if (!collided) {
                c.x = nextX;
                c.z = nextZ;
                c.climbing = false;
            }

            if (c.climbing) {
                c.y += climbCmd * 0.5;
                if (nearestTree && c.y > nearestTree.height) c.y = nearestTree.height;
            } else {
                c.y -= 0.2;
                if (c.y < 0) c.y = 0;
            }

            if (isNaN(c.x) || isNaN(c.z) || isNaN(c.y)) {
                c.x = 0; c.z = 0; c.y = 0; c.vx = 0; c.vz = 0;
            }

            // FIX: Smooth Color Transitions
            if (oxytocin > 0) targetColor.copy(colorPink);
            else if (dopamine > 0) targetColor.copy(colorCyan);
            else targetColor.copy(colorGreen);
            
            creature.material.color.lerp(targetColor, 0.1);

            document.getElementById('status').innerText = `Y: ${c.y.toFixed(1)} | Climbing: ${c.climbing}`;
            document.getElementById('drive_text').innerText = `Drive: ${(10 - c.y).toFixed(1)}`;
            document.getElementById('oxytocin_text').innerText = `Oxytocin: ${oxytocin.toFixed(1)}`;
            document.getElementById('dopamine_text').innerText = `Dopamine: ${dopamine.toFixed(1)}`;
        }

        function render() {
            creature.position.set(c.x, c.y + 1, c.z);
            creature.rotation.y = c.angle;

            const camDistance = 25;
            const camHeight = 15;
            
            camera.position.x = creature.position.x - Math.sin(c.angle) * camDistance;
            camera.position.z = creature.position.z - Math.cos(c.angle) * camDistance;
            camera.position.y = creature.position.y + camHeight;
            
            camera.lookAt(creature.position);
            renderer.render(scene, camera);
        }

        function loop() {
            simulate();
            render();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
