<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: monospace; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 0; }
        #ui { position: absolute; top: 10px; left: 10px; color: #fff; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px; z-index: 100; pointer-events: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">
        <div>Neurons: 10,500 (JS Engine)</div>
        <div>Urge: Climb High</div>
        <div id="status">Status: Waking up...</div>
    </div>
    <script>
        // ==========================================
        // 1. THE 10,500-NEURON JS BRAIN (Clamped)
        // ==========================================
        class MegaBrain {
            constructor() {
                this.numNeurons = 10500;
                this.numInputs = 130;
                this.numOutputs = 10;
                this.V = new Float32Array(this.numNeurons);
                this.connections = [];
                const totalConnections = Math.floor(this.numNeurons * this.numNeurons * 0.01);
                
                for (let i = 0; i < totalConnections; i++) {
                    this.connections.push({
                        from: Math.floor(Math.random() * this.numNeurons),
                        to: Math.floor(Math.random() * this.numNeurons),
                        weight: (Math.random() * 2 - 1) * 0.1
                    });
                }
                this.learningRate = 0.05;
            }

            step(inputs, dopamine) {
                for (let i = 0; i < this.numInputs; i++) {
                    this.V[i] = inputs[i];
                }

                let newV = new Float32Array(this.numNeurons);
                for (let i = 0; i < this.numNeurons; i++) {
                    newV[i] = this.V[i] * 0.95;
                }

                for (let c of this.connections) {
                    newV[c.to] += this.V[c.from] * c.weight;
                }

                // FIX: Clamp membrane potential to prevent explosions
                for (let i = 0; i < this.numNeurons; i++) {
                    this.V[i] = Math.max(0, Math.min(10.0, newV[i]));
                }

                // Dopamine-gated Hebbian learning
                if (dopamine > 0.01) {
                    for (let c of this.connections) {
                        if (this.V[c.from] > 1.0 && this.V[c.to] > 1.0) {
                            c.weight += this.learningRate * dopamine;
                            // FIX: Clamp weights so they don't grow to infinity
                            c.weight = Math.max(-5.0, Math.min(5.0, c.weight));
                        }
                    }
                }

                for (let c of this.connections) {
                    c.weight *= 0.9999;
                }

                let out = [];
                for (let i = this.numNeurons - this.numOutputs; i < this.numNeurons; i++) {
                    // FIX: Output 0 if NaN
                    out.push(isNaN(this.V[i]) ? 0 : this.V[i]);
                }
                return out;
            }
        }

        const brain = new MegaBrain();

        // ==========================================
        // 2. THE 3D WORLD
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 50, 200);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(50, 100, 50);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        const groundGeo = new THREE.PlaneGeometry(500, 500);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x556B2F });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.1;
        scene.add(ground);

        const grid = new THREE.GridHelper(200, 100, 0x000000, 0x222222);
        scene.add(grid);

        const creatureGeo = new THREE.BoxGeometry(2, 2, 2);
        const creatureMat = new THREE.MeshLambertMaterial({ color: 0x00FF00 });
        const creature = new THREE.Mesh(creatureGeo, creatureMat);
        scene.add(creature);

        let trees = [];
        function addTree(x, z, height) {
            const trunkGeo = new THREE.CylinderGeometry(1, 1, height, 8);
            const trunkMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.set(x, height / 2, z);
            scene.add(trunk);

            const leavesGeo = new THREE.ConeGeometry(4, 8, 8);
            const leavesMat = new THREE.MeshLambertMaterial({ color: 0x228B22 });
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.set(x, height + 2, z);
            scene.add(leaves);
            trees.push({ x: x, z: z, height: height, radius: 1.5 });
        }

        for (let i = 0; i < 30; i++) {
            addTree((Math.random() - 0.5) * 150, (Math.random() - 0.5) * 150, Math.random() * 10 + 5);
        }

        // ==========================================
        // 3. PHYSICS & LOOP
        // ==========================================
        let c = { x: 0, y: 0, z: 0, angle: 0, climbing: false };
        let zoomLevel = 1.0;

        function simulate() {
            let nearestTree = null;
            let minDist = 999;
            for (let t of trees) {
                let dist = Math.sqrt((t.x - c.x)**2 + (t.z - c.z)**2);
                if (dist < minDist) { minDist = dist; nearestTree = t; }
            }

            let inputs = new Float32Array(130);
            if (nearestTree) {
                let dx = nearestTree.x - c.x;
                let dz = nearestTree.z - c.z;
                let angle = Math.atan2(dz, dx);
                inputs[0] = 1.0 / (minDist + 1);
                inputs[1] = Math.sin(angle);
                inputs[2] = Math.cos(angle);
            }
            if (c.y < 0) inputs[100] = 1.0;
            let drive = Math.max(0, 10 - c.y);
            inputs[110] = drive;
            inputs[120] = c.y;

            let dopamine = c.y > 2.0 ? c.y * 0.1 : 0.0;
            let motorOut = brain.step(inputs, dopamine);

            let moveX = Math.max(-1, Math.min(1, motorOut[0] * 0.5));
            let moveZ = Math.max(-1, Math.min(1, motorOut[1] * 0.5));
            let climbCmd = Math.max(0, Math.min(1, motorOut[2]));
            let lookCmd = Math.max(-0.1, Math.min(0.1, motorOut[3] * 0.05));

            c.angle += lookCmd;
            
            // Tentative move
            let nextX = c.x + (moveX * Math.cos(c.angle) - moveZ * Math.sin(c.angle));
            let nextZ = c.z + (moveX * Math.sin(c.angle) + moveZ * Math.cos(c.angle));

            // FIX: Hard Collision with Trees
            let collided = false;
            for (let t of trees) {
                let distToTree = Math.sqrt((t.x - nextX)**2 + (t.z - nextZ)**2);
                if (distToTree < t.radius + 1.0) { // 1.0 is creature radius
                    collided = true;
                    c.climbing = true;
                    break;
                }
            }

            if (!collided) {
                c.x = nextX;
                c.z = nextZ;
                c.climbing = false;
            }

            // Climbing logic
            if (c.climbing) {
                c.y += climbCmd * 0.5;
                if (nearestTree && c.y > nearestTree.height) {
                    c.y = nearestTree.height;
                }
            } else {
                c.y -= 0.2;
                if (c.y < 0) c.y = 0;
            }

            // FIX: Sanity check to prevent Cyan Void
            if (isNaN(c.x) || isNaN(c.z) || isNaN(c.y)) {
                console.warn("Brain exploded! Resetting position.");
                c.x = 0; c.z = 0; c.y = 0;
            }

            document.getElementById('status').innerText = `Status: Y=${c.y.toFixed(1)} | Drive: ${drive.toFixed(2)} | Climbing: ${c.climbing}`;
        }

        function render() {
            creature.position.set(c.x, c.y + 1, c.z);
            creature.rotation.y = c.angle;

            const camDistance = 25 / zoomLevel;
            const camHeight = 15 / zoomLevel;
            
            camera.position.x = creature.position.x - Math.sin(c.angle) * camDistance;
            camera.position.z = creature.position.z - Math.cos(c.angle) * camDistance;
            camera.position.y = creature.position.y + camHeight;
            
            camera.lookAt(creature.position);
            renderer.render(scene, camera);
        }

        function loop() {
            simulate();
            render();
            requestAnimationFrame(loop);
        }

        // Pinch to Zoom
        let lastPinchDist = 0;
        renderer.domElement.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                let dx = e.touches[0].clientX - e.touches[1].clientX;
                let dy = e.touches[0].clientY - e.touches[1].clientY;
                lastPinchDist = Math.sqrt(dx*dx + dy*dy);
            }
        });
        renderer.domElement.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                let dx = e.touches[0].clientX - e.touches[1].clientX;
                let dy = e.touches[0].clientY - e.touches[1].clientY;
                let dist = Math.sqrt(dx*dx + dy*dy);
                if (lastPinchDist > 0) {
                    zoomLevel *= (dist / lastPinchDist);
                    zoomLevel = Math.max(0.3, Math.min(zoomLevel, 3.0));
                }
                lastPinchDist = dist;
            }
        }, { passive: false });
        renderer.domElement.addEventListener('touchend', () => { lastPinchDist = 0; });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        loop();
    </script>
</body>
</html>
